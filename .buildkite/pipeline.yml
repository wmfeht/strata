# Strata CI. Point the Buildkite pipeline's initial steps at:
#   buildkite-agent pipeline upload .buildkite/pipeline.yml
#
# Agents must be Linux amd64 with mise and Docker. Host steps use the toolchain
# pinned in mise.toml. Quality and E2E compile in the published environment
# (`scripts/quality.sh` and `scripts/e2e.sh`) so GTK tests and visual baselines
# stay on the dated Ubuntu snapshot.

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  STRATA_CONTAINER_ENGINE: docker

steps:
  - group: ":rust: Quality"
    key: quality
    steps:
      - label: ":rust: Format"
        key: fmt
        command: .buildkite/run.sh ./scripts/quality.sh fmt
        timeout_in_minutes: 20
        retry:
          automatic:
            - exit_status: -1
              limit: 2

      - label: ":lint-roller: Clippy"
        key: clippy
        command: .buildkite/run.sh ./scripts/quality.sh clippy
        timeout_in_minutes: 30
        retry:
          automatic:
            - exit_status: -1
              limit: 2

      - label: ":hammer: Tests"
        key: test
        command: .buildkite/run.sh ./scripts/quality.sh test
        timeout_in_minutes: 30
        retry:
          automatic:
            - exit_status: -1
              limit: 2

  - group: ":mag: Policy"
    key: policy
    steps:
      - label: ":python: Script tests"
        key: scripts
        command: .buildkite/run.sh python3 -m unittest discover -s scripts -p 'test_*.py'
        timeout_in_minutes: 5
        retry:
          automatic:
            - exit_status: -1
              limit: 2

      - label: ":lock: cargo-deny"
        key: deny
        command: .buildkite/run.sh cargo deny check
        timeout_in_minutes: 10
        retry:
          automatic:
            - exit_status: -1
              limit: 2

      - label: ":pencil2: typos"
        key: typos
        command: .buildkite/run.sh typos
        timeout_in_minutes: 5
        retry:
          automatic:
            - exit_status: -1
              limit: 2

  - group: ":checkered_flag: End-to-end"
    key: e2e-group
    steps:
      - label: ":docker: E2E GUI suite"
        key: e2e
        command: .buildkite/run.sh ./scripts/e2e.sh -p no:cacheprovider --timeout=60 --durations=10
        timeout_in_minutes: 40
        env:
          STRATA_E2E_WORKERS: "8"
        artifact_paths:
          - target/e2e-artifacts/**/*
        retry:
          automatic:
            - exit_status: -1
              limit: 2
